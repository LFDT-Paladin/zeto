name: Docs Site

on:
  release:
    types: [released]
  push:
    branches:
      - main
    paths:
      - "doc-site/docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "doc-site/docs/**"
      - ".github/workflows/docs.yaml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LATEST_TAG: ""
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Docs Deploy
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "noreply@github.com"

      - name: Get the latest tag
        run: |
          # Force-sync tags from origin; plain `git fetch --tags` fails when a
          # local tag (from checkout) points at a different commit than remote.
          git fetch origin --tags --force
          latest_tag=$(git tag -l | sort -V | grep -v "rc" | tail -n 1)
          echo "latest tag: $latest_tag"
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV

      - name: Install docs dependencies
        working-directory: doc-site
        run: pip install -r requirements.txt

      - name: Update doc site for release
        if: github.event.action == 'released' && github.ref_name != env.LATEST_TAG
        working-directory: doc-site
        run: mike deploy ${GITHUB_EVENT_RELEASE_TAG_NAME} --push
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Update doc site for latest release
        if: github.event.action == 'released' && github.ref_name == env.LATEST_TAG
        working-directory: doc-site
        run: |
          mike deploy ${GITHUB_EVENT_RELEASE_TAG_NAME} latest -u --push
          mike set-default --push latest
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Update doc site for `main` branch
        if: ${{ github.event_name == 'push' }}
        working-directory: doc-site
        run: mike deploy head --push

      - name: Test building the doc site but do not deploy it
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: doc-site
        run: mkdocs build
