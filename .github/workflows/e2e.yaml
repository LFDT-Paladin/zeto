name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "doc-site/**"
      - ".github/workflows/docs.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/release-solidity-package.yaml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "doc-site/**"
      - ".github/workflows/docs.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/release-solidity-package.yaml"
  workflow_dispatch:

jobs:
  setup-prerequisites:
    uses: ./.github/workflows/e2e-deps.yaml
  integration-test:
    needs: setup-prerequisites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: my-secret
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Free up disk space on runner
        uses: ./.github/actions/free-up-disk-space

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26

      - name: Setup node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Checkout Zeto
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: zeto
          fetch-depth: 0
          persist-credentials: false

      # Using the `keccak256` branch of the `kaleido-io/contracts` repository
      # which is a fork of the `iden3/contracts` repository with the `keccak256` hash function
      # used for the Sparse Merkle Tree, with breaking changes since Poseidon is no longer the default.
      - name: Checkout iden3/contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kaleido-io/contracts
          ref: keccak256
          path: contracts
          fetch-depth: 0
          persist-credentials: false

      - name: Setup temp dir for the artifacts
        run: |
          mkdir -p ${{ runner.temp }}/zeto-artifacts

      - name: Download zeto artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.setup-prerequisites.outputs.artifacts-name }}
          path: ${{ runner.temp }}/zeto-artifacts

      - name: Run golang e2e tests
        env:
          PROVING_KEYS_ROOT: ${{ runner.temp }}/zeto-artifacts
          CIRCUITS_ROOT: ${{ runner.temp }}/zeto-artifacts
        working-directory: zeto/go-sdk/integration-test
        run: |
          echo "PROVING_KEYS_ROOT: $PROVING_KEYS_ROOT"
          echo "CIRCUITS_ROOT: $CIRCUITS_ROOT"
          ls -la $PROVING_KEYS_ROOT
          make e2e

      - name: Run js e2e tests
        env:
          PROVING_KEYS_ROOT: ${{ runner.temp }}/zeto-artifacts
          CIRCUITS_ROOT: ${{ runner.temp }}/zeto-artifacts
        working-directory: zeto/zkp/js
        run: |
          npm install
          npm run test:e2e

      - name: Run Zeto Tokens hardhat tests as upgradeable contracts
        env:
          PROVING_KEYS_ROOT: ${{ runner.temp }}/zeto-artifacts
          CIRCUITS_ROOT: ${{ runner.temp }}/zeto-artifacts
        working-directory: zeto/solidity
        run: |
          npm install
          npm t

      - name: Run Zeto Tokens hardhat tests as cloned contracts
        env:
          USE_FACTORY: true
          PROVING_KEYS_ROOT: ${{ runner.temp }}/zeto-artifacts
          CIRCUITS_ROOT: ${{ runner.temp }}/zeto-artifacts
        working-directory: zeto/solidity
        run: |
          npm install
          npm t
